    <meta name="theme-color" content="#ffffff" />
    <meta
      name="description"
      content="Gopichand Guguloth is a Computer Science undergraduate building reliable full-stack products and AI-powered applications."
    />
    <script>
      try {
        const savedTheme = localStorage.getItem("gopichand-portfolio-theme-v2");
        const initialTheme = savedTheme === "dark" ? "dark" : "light";
        document.documentElement.dataset.theme = initialTheme;
        document.documentElement.style.colorScheme = initialTheme;
      } catch {
        document.documentElement.dataset.theme = "light";
        document.documentElement.style.colorScheme = "light";
      }
    </script>
    <title>Gopichand Guguloth — Software Engineer & AI Builder</title>

    />

</html>
